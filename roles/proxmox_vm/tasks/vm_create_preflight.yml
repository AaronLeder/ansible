---
# =============================================================================
# vm_create_preflight.yml
#
# Validates all inputs, queries the Proxmox cluster, and builds pve_create_plan
# — a list of dicts that vm_create_baremetal.yml iterates over.
#
# Each entry in pve_create_plan contains every parameter needed to create
# one VM, resolved from (in priority order):
#   1. host_vars  (per-VM overrides)
#   2. group_vars (group-level defaults, e.g. elastic, kibana)
#   3. role defaults (group_vars/all/main.yml)
# =============================================================================

- name: Create Preflight | Guard — skip when disabled
  ansible.builtin.debug:
    msg: "pve_create_enabled=false; skipping create workflow."
  when: not (pve_create_enabled | default(true) | bool)

- name: Create Preflight | End play when disabled
  ansible.builtin.meta: end_play
  when: not (pve_create_enabled | default(true) | bool)

# ----- Resolve target list ---------------------------------------------------

- name: Create Preflight | Resolve create target list
  ansible.builtin.set_fact:
    _pve_create_targets: >-
      {{
        pve_create_vm
        if (pve_create_vm | default([]) | length) > 0
        else (groups['pve_vm_to_create'] | default([]))
      }}

- name: Create Preflight | Assert target list is not empty
  ansible.builtin.assert:
    that:
      - (_pve_create_targets | length) > 0
    fail_msg: >-
      No create targets found. Either set pve_create_vm in the playbook/vars,
      or populate the inventory group 'pve_vm_to_create'.

# ----- Per-host inventory checks ---------------------------------------------

- name: Create Preflight | Assert each target has ansible_host and pve_vmid
  ansible.builtin.assert:
    that:
      - hostvars[item].ansible_host is defined
      - hostvars[item].pve_vmid is defined
    fail_msg: >-
      '{{ item }}' must define both ansible_host and pve_vmid in inventory
      (inventory/master_hosts.yml or host_vars/{{ item }}.yml).
  loop: "{{ _pve_create_targets }}"

- name: Create Preflight | Assert network vars are available for each target
  ansible.builtin.assert:
    that:
      - (hostvars[item].pve_create_prefix is defined) or (pve_create_prefix is defined)
      - (hostvars[item].pve_create_gateway is defined) or (pve_create_gateway is defined)
    fail_msg: >-
      '{{ item }}' needs pve_create_prefix and pve_create_gateway.
      Set them in host_vars/{{ item }}.yml, the relevant group_vars file,
      or pass as extra-vars.
  loop: "{{ _pve_create_targets }}"

# ----- Proxmox cluster query -------------------------------------------------

- name: Create Preflight | Query Proxmox cluster node list
  ansible.builtin.uri:
    url: "https://{{ pve_api_host }}:{{ pve_api_port | default(8006) }}/api2/json/nodes"
    method: GET
    validate_certs: "{{ pve_validate_certs | default(false) }}"
    return_content: true
    status_code: [200]
    headers:
      Authorization: "PVEAPIToken={{ pve_api_token_full_id }}={{ pve_api_token_secret }}"
  register: _pve_nodes_resp
  changed_when: false
  no_log: true

- name: Create Preflight | Extract cluster node names
  ansible.builtin.set_fact:
    _pve_cluster_nodes: >-
      {{ (_pve_nodes_resp.json.data | default([])) | map(attribute='node') | list }}

- name: Create Preflight | Resolve default target node
  ansible.builtin.set_fact:
    _pve_create_default_node: "{{ pve_create_target_node | default(pve_api_host) }}"

- name: Create Preflight | Assert default target node is in the cluster
  ansible.builtin.assert:
    that:
      - _pve_create_default_node in _pve_cluster_nodes
    fail_msg: >-
      Default target node '{{ _pve_create_default_node }}' was not found in
      cluster nodes {{ _pve_cluster_nodes }}. Check pve_create_target_node
      or pve_api_host.

# ----- Build create plan -----------------------------------------------------

- name: Create Preflight | Initialise create plan
  ansible.builtin.set_fact:
    pve_create_plan: []

- name: Create Preflight | Build create plan entry for each target
  ansible.builtin.set_fact:
    pve_create_plan: >-
      {{
        pve_create_plan + [
          {
            'host': item,
            'vmid': hostvars[item].pve_vmid | int,
            'target_node': (
              hostvars[item].pve_create_target_node
              | default(hostvars[item].create_target_node
              | default(_pve_create_default_node))
            ),

            'cores': (hostvars[item].pve_cores | default(pve_create_cores)) | int,
            'sockets': (hostvars[item].pve_sockets | default(pve_create_sockets)) | int,
            'memory': (hostvars[item].pve_memory | default(pve_create_memory)) | int,
            'cpu': hostvars[item].pve_cpu | default(pve_create_cpu),

            'bios': hostvars[item].pve_bios | default(pve_create_bios),
            'machine': hostvars[item].pve_machine | default(pve_create_machine),
            'boot': hostvars[item].pve_boot | default(pve_create_boot),
            'ostype': hostvars[item].pve_ostype | default(pve_create_ostype),

            'scsi': (
              hostvars[item].pve_scsi
              | default({
                'scsi0': (hostvars[item].pve_create_storage | default(pve_create_storage))
                  + ':' + ((hostvars[item].pve_disk_size | default(pve_create_disk_size)) | string)
                  + ',iothread=1'
              })
            ),
            'scsihw': hostvars[item].pve_scsihw | default(pve_create_scsihw),

            'net': (
              hostvars[item].pve_net
              | default({
                'net0': 'virtio,bridge='
                  + (hostvars[item].pve_bridge | default(pve_create_bridge))
                  + ',tag='
                  + ((hostvars[item].pve_vlan | default(pve_create_vlan)) | string)
              })
            ),

            # ide2 is reserved for cloud-init. OS ISOs go on ide0 when cloud-init is active.
            'ide': (
              hostvars[item].pve_ide
              | default(
                (
                  ({'ide2': (hostvars[item].pve_cloudinit_storage | default(pve_create_storage)) + ':cloudinit'}
                   if (pve_create_use_cloudinit | default(false) | bool) else {})
                  | combine(
                    ({'ide0': (hostvars[item].pve_iso | default(pve_create_iso)) + ',media=cdrom'}
                     if ((hostvars[item].pve_iso | default(pve_create_iso)) != ''
                         and (pve_create_use_cloudinit | default(false) | bool))
                     else
                     ({'ide2': (hostvars[item].pve_iso | default(pve_create_iso)) + ',media=cdrom'}
                      if ((hostvars[item].pve_iso | default(pve_create_iso)) != '')
                      else {}))
                  )
                )
              )
            ),

            'agent': hostvars[item].pve_agent | default(pve_create_agent) | default('enabled=1'),
            'onboot': (hostvars[item].pve_onboot | default(pve_create_onboot)) | bool,
            'protection': (hostvars[item].pve_protection | default(pve_create_protection)) | bool,
            'tags': hostvars[item].pve_tags | default(pve_create_tags),
            'pool': hostvars[item].pve_pool | default(pve_create_pool),

            # Cloud-init fields — only populated when cloud-init is enabled
            'ipconfig': (
              hostvars[item].pve_ipconfig
              | default({
                'ipconfig0':
                  'ip=' + hostvars[item].ansible_host
                  + '/' + ((hostvars[item].pve_prefix | default(pve_create_prefix)) | string)
                  + ',gw=' + (hostvars[item].pve_gateway | default(pve_create_gateway))
              })
            ) if (pve_create_use_cloudinit | default(false) | bool) else {},

            'ciuser': (hostvars[item].pve_ciuser | default(pve_create_ciuser))
              if (pve_create_use_cloudinit | default(false) | bool) else '',

            'cipassword': (hostvars[item].pve_cipassword | default(pve_create_cipassword))
              if (pve_create_use_cloudinit | default(false) | bool) else '',

            'sshkeys': (hostvars[item].pve_sshkeys | default(pve_create_sshkeys))
              if (pve_create_use_cloudinit | default(false) | bool) else '',

            'autostart': (hostvars[item].pve_autostart | default(pve_create_autostart)) | bool
          }
        ]
      }}
  loop: "{{ _pve_create_targets }}"

# ----- Plan validation -------------------------------------------------------

- name: Create Preflight | Assert VMIDs in the plan are unique
  ansible.builtin.assert:
    that:
      - (pve_create_plan | map(attribute='vmid') | list | length)
        == (pve_create_plan | map(attribute='vmid') | list | unique | length)
    fail_msg: >-
      Duplicate VMIDs detected in create plan: {{ pve_create_plan | map(attribute='vmid') | list }}.
      Assign unique pve_vmid values in inventory or host_vars.

- name: Create Preflight | Assert each plan target node exists in the cluster
  ansible.builtin.assert:
    that:
      - item.target_node in _pve_cluster_nodes
    fail_msg: >-
      Target node '{{ item.target_node }}' for '{{ item.host }}' is not in
      cluster nodes {{ _pve_cluster_nodes }}.
  loop: "{{ pve_create_plan }}"

- name: Create Preflight | Display resolved create plan
  ansible.builtin.debug:
    msg: "{{ pve_create_plan }}"
