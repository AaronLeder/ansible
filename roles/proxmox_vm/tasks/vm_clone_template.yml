---
# =============================================================================
# vm_clone_template.yml
#
# Executes the clone workflow against the pre-validated pve_clone_plan.
# Steps:
#   1. Guard against VMID collisions
#   2. Clone each VM from the template
#   3. Detect missing boot disk; create + attach if absent
#   4. Re-read config and fix boot order to reference the real disk device
#   5. Verify final state
#   6. Wait for VMs to appear in Proxmox inventory
#   7. Optionally start VMs
# =============================================================================

# ----- VMID collision guard --------------------------------------------------

- name: Clone | Check whether target VMIDs already exist
  community.proxmox.proxmox_vm_info:
    api_host:         "{{ pve_api_host }}"
    api_port:         "{{ pve_api_port | default(8006) }}"
    api_user:         "{{ pve_api_user }}"
    api_token_id:     "{{ pve_api_token_id }}"
    api_token_secret: "{{ pve_api_token_secret }}"
    api_password:     "{{ pve_api_password | default(omit) }}"
    validate_certs:   "{{ pve_validate_certs | default(false) }}"
    type: qemu
    vmid: "{{ item.vmid }}"
  loop: "{{ pve_clone_plan }}"
  register: _vmid_check

- name: Clone | Classify existing VMIDs as matching or conflicting
  ansible.builtin.set_fact:
    _pve_clone_existing_ok: "{{ (_pve_clone_existing_ok | default([])) + [item.item] }}"
  loop: "{{ _vmid_check.results }}"
  when:
    - (item.proxmox_vms | default([]) | length) > 0
    - (item.proxmox_vms[0].name | default('')) == item.item.host
    - (item.proxmox_vms[0].node | default('')) == item.item.target_node

- name: Clone | Fail on VMID collisions that point at a different VM
  ansible.builtin.assert:
    that:
      - (item.proxmox_vms | default([]) | length) == 0
        or (
          (item.proxmox_vms[0].name | default('')) == item.item.host
          and (item.proxmox_vms[0].node | default('')) == item.item.target_node
        )
    fail_msg: >-
      VMID {{ item.item.vmid }} is already in use by
      '{{ item.proxmox_vms[0].name | default('unknown') }}' on
      '{{ item.proxmox_vms[0].node | default('unknown') }}', not the requested
      '{{ item.item.host }}' on '{{ item.item.target_node }}'.
      Choose a different pve_vmid or delete the conflicting VM first.
  loop: "{{ _vmid_check.results }}"

- name: Clone | Build list of VMs that still need cloning
  ansible.builtin.set_fact:
    _pve_clone_pending: >-
      {{
        pve_clone_plan
        | rejectattr('vmid', 'in', (_pve_clone_existing_ok | default([])) | map(attribute='vmid') | list)
        | list
      }}

- name: Clone | Report VMs already present and reused
  ansible.builtin.debug:
    msg: >-
      VMID {{ item.vmid }} ('{{ item.host }}') already exists on
      '{{ item.target_node }}'; skipping clone and continuing.
  loop: "{{ _pve_clone_existing_ok | default([]) }}"
  changed_when: false

# ----- Clone -----------------------------------------------------------------

- name: Clone | Clone VMs from template
  community.proxmox.proxmox_kvm:
    api_host:         "{{ pve_api_host }}"
    api_port:         "{{ pve_api_port | default(8006) }}"
    api_user:         "{{ pve_api_user }}"
    api_token_id:     "{{ pve_api_token_id }}"
    api_token_secret: "{{ pve_api_token_secret }}"
    api_password:     "{{ pve_api_password | default(omit) }}"
    validate_certs:   "{{ pve_validate_certs | default(false) }}"

    node:     "{{ item.target_node }}"
    clone:    "{{ pve_clone_template_name }}"
    newid:    "{{ item.vmid }}"
    name:     "{{ item.host }}"
    full:     "{{ item.full }}"
    storage:  "{{ item.storage }}"
    format:   "{{ item.format }}"
    pool:     "{{ item.pool if ((item.pool | default('') | string | length) > 0) else omit }}"

    ipconfig:   "{{ item.ipconfig if (item.ipconfig | default({}) | length) > 0 else omit }}"
    ciuser:     "{{ item.ciuser if ((item.ciuser | default('') | length) > 0) else omit }}"
    cipassword: "{{ item.cipassword if ((item.cipassword | default('') | length) > 0) else omit }}"
    sshkeys:    "{{ item.sshkeys if ((item.sshkeys | default('') | length) > 0) else omit }}"

    tags:    "{{ item.tags if ((item.tags | default('') | string | length) > 0) else omit }}"
    timeout: "{{ pve_clone_timeout | default(900) }}"
  loop: "{{ _pve_clone_pending | default([]) }}"
  register: _clone_result

# ----- Post-clone: detect and attach missing boot disk -----------------------

- name: Clone | Read VM config (post-clone)
  ansible.builtin.uri:
    url: "https://{{ pve_api_host }}:{{ pve_api_port | default(8006) }}/api2/json/nodes/{{ item.target_node }}/qemu/{{ item.vmid }}/config"
    method: GET
    validate_certs: "{{ pve_validate_certs | default(false) }}"
    return_content: true
    status_code: [200]
    headers:
      Authorization: "PVEAPIToken={{ pve_api_token_full_id }}={{ pve_api_token_secret }}"
  loop: "{{ pve_clone_plan }}"
  register: _clone_cfg
  changed_when: false

- name: Clone | Attach boot disk if clone has no disk devices
  community.proxmox.proxmox_kvm:
    api_host:         "{{ pve_api_host }}"
    api_port:         "{{ pve_api_port | default(8006) }}"
    api_user:         "{{ pve_api_user }}"
    api_token_id:     "{{ pve_api_token_id }}"
    api_token_secret: "{{ pve_api_token_secret }}"
    api_password:     "{{ pve_api_password | default(omit) }}"
    validate_certs:   "{{ pve_validate_certs | default(false) }}"

    node:    "{{ item.item.target_node }}"
    vmid:    "{{ item.item.vmid }}"
    scsihw:  "{{ _cfg.scsihw | default('virtio-scsi-single') }}"

    scsi:   "{{ _disk_map if _bus == 'scsi'   else omit }}"
    virtio: "{{ _disk_map if _bus == 'virtio' else omit }}"
    sata:   "{{ _disk_map if _bus == 'sata'   else omit }}"
    nvme:   "{{ _disk_map if _bus == 'nvme'   else omit }}"
    ide:    "{{ _disk_map if _bus == 'ide'    else omit }}"

    update:        true
    update_unsafe: true
    state:         present
    timeout:       "{{ pve_clone_timeout | default(900) }}"
  vars:
    _cfg: "{{ item.json.data }}"
    _scsi_disks:  "{{ _cfg | dict2items | selectattr('key','match','^scsi[0-9]+$')  | rejectattr('value','search','cloudinit') | rejectattr('value','search','media=cdrom') | map(attribute='key') | list }}"
    _virtio_disks: "{{ _cfg | dict2items | selectattr('key','match','^virtio[0-9]+$') | rejectattr('value','search','cloudinit') | rejectattr('value','search','media=cdrom') | map(attribute='key') | list }}"
    _sata_disks:  "{{ _cfg | dict2items | selectattr('key','match','^sata[0-9]+$')  | rejectattr('value','search','cloudinit') | rejectattr('value','search','media=cdrom') | map(attribute='key') | list }}"
    _nvme_disks:  "{{ _cfg | dict2items | selectattr('key','match','^nvme[0-9]+$')  | rejectattr('value','search','cloudinit') | rejectattr('value','search','media=cdrom') | map(attribute='key') | list }}"
    _ide_disks:   "{{ _cfg | dict2items | selectattr('key','match','^ide[0-9]+$')   | rejectattr('value','search','cloudinit') | rejectattr('value','search','media=cdrom') | map(attribute='key') | list }}"
    _boot_disk_found: >-
      {{
        (_scsi_disks | first)  if (_scsi_disks  | length) > 0 else
        ((_virtio_disks | first) if (_virtio_disks | length) > 0 else
         ((_sata_disks | first)  if (_sata_disks  | length) > 0 else
          ((_nvme_disks | first) if (_nvme_disks  | length) > 0 else
           ((_ide_disks | first) if (_ide_disks   | length) > 0 else ''))))
      }}
    _desired_disk_key: >-
      {{
        (_cfg.bootdisk | string)
        if (
          _cfg.bootdisk is defined
          and (_cfg.bootdisk | string) is match('^(scsi|virtio|sata|nvme|ide)[0-9]+$')
          and (_cfg.bootdisk | string) != 'ide2'
        )
        else 'scsi0'
      }}
    _bus: "{{ (_desired_disk_key | regex_search('^(scsi|virtio|sata|nvme|ide)')) | default('scsi') }}"
    _disk_size_gb: "{{ pve_clone_disk_size | default(pve_create_disk_size | default(100)) }}"
    _disk_spec: >-
      {{
        item.item.storage ~ ':' ~ (_disk_size_gb | string)
        ~ ',iothread=1'
      }}
    _disk_map: "{{ { _desired_disk_key: _disk_spec } }}"
  when: _boot_disk_found == ''
  loop: "{{ _clone_cfg.results }}"

# ----- Re-read config and fix boot order ------------------------------------

- name: Clone | Re-read VM config after disk attachment
  ansible.builtin.uri:
    url: "https://{{ pve_api_host }}:{{ pve_api_port | default(8006) }}/api2/json/nodes/{{ item.target_node }}/qemu/{{ item.vmid }}/config"
    method: GET
    validate_certs: "{{ pve_validate_certs | default(false) }}"
    return_content: true
    status_code: [200]
    headers:
      Authorization: "PVEAPIToken={{ pve_api_token_full_id }}={{ pve_api_token_secret }}"
  loop: "{{ pve_clone_plan }}"
  register: _clone_cfg2
  changed_when: false

- name: Clone | Fix boot order to reference real boot disk
  community.proxmox.proxmox_kvm:
    api_host:         "{{ pve_api_host }}"
    api_port:         "{{ pve_api_port | default(8006) }}"
    api_user:         "{{ pve_api_user }}"
    api_token_id:     "{{ pve_api_token_id }}"
    api_token_secret: "{{ pve_api_token_secret }}"
    api_password:     "{{ pve_api_password | default(omit) }}"
    validate_certs:   "{{ pve_validate_certs | default(false) }}"
    node:   "{{ item.item.target_node }}"
    vmid:   "{{ item.item.vmid }}"
    boot:   "{{ _boot_order }}"
    update: true
    state:  present
  vars:
    _cfg: "{{ item.json.data }}"
    _scsi_disks:  "{{ _cfg | dict2items | selectattr('key','match','^scsi[0-9]+$')  | rejectattr('value','search','cloudinit') | rejectattr('value','search','media=cdrom') | map(attribute='key') | list | sort }}"
    _virtio_disks: "{{ _cfg | dict2items | selectattr('key','match','^virtio[0-9]+$') | rejectattr('value','search','cloudinit') | rejectattr('value','search','media=cdrom') | map(attribute='key') | list | sort }}"
    _sata_disks:  "{{ _cfg | dict2items | selectattr('key','match','^sata[0-9]+$')  | rejectattr('value','search','cloudinit') | rejectattr('value','search','media=cdrom') | map(attribute='key') | list | sort }}"
    _nvme_disks:  "{{ _cfg | dict2items | selectattr('key','match','^nvme[0-9]+$')  | rejectattr('value','search','cloudinit') | rejectattr('value','search','media=cdrom') | map(attribute='key') | list | sort }}"
    _ide_disks:   "{{ _cfg | dict2items | selectattr('key','match','^ide[0-9]+$')   | rejectattr('value','search','cloudinit') | rejectattr('value','search','media=cdrom') | map(attribute='key') | list | sort }}"
    _boot_disk: >-
      {{
        (_scsi_disks[0]  if (_scsi_disks  | length) > 0 else
        (_virtio_disks[0] if (_virtio_disks | length) > 0 else
        (_sata_disks[0]  if (_sata_disks  | length) > 0 else
        (_nvme_disks[0]  if (_nvme_disks  | length) > 0 else
        (_ide_disks[0]   if (_ide_disks   | length) > 0 else '')))))
      }}
    _cloudinit_keys: "{{ _cfg | dict2items | selectattr('value','search','cloudinit') | map(attribute='key') | list | sort }}"
    _cloudinit_dev: "{{ _cloudinit_keys[0] if (_cloudinit_keys | length) > 0 else '' }}"
    _boot_order: >-
      {{
        'order=' + _boot_disk
        + (';' + _cloudinit_dev if _cloudinit_dev != '' else '')
        + (';net0' if (_cfg.net0 is defined) else '')
      }}
  loop: "{{ _clone_cfg2.results }}"

# ----- Final verification ----------------------------------------------------

- name: Clone | Verify cloned VMs have a valid boot disk and order
  ansible.builtin.assert:
    that:
      - _boot_disk != ''
      - >-
        (_cfg.boot is defined) and (
          ('order=' in (_cfg.boot | string))
          or (
            (_cfg.boot | string) == 'c'
            and (_cfg.bootdisk | default('') | string) == _boot_disk
          )
        )
    fail_msg: >-
      VMID {{ item.item.vmid }} on {{ item.item.target_node }} still has no
      bootable disk or boot order after all fix attempts.
      Config keys: {{ (_cfg.keys() | list) | sort }};
      boot={{ _cfg.boot | default('missing') }};
      bootdisk={{ _cfg.bootdisk | default('missing') }};
      detected_boot_disk={{ _boot_disk }}
  vars:
    _cfg: "{{ item.json.data }}"
    _scsi_disks:  "{{ _cfg | dict2items | selectattr('key','match','^scsi[0-9]+$')  | rejectattr('value','search','cloudinit') | rejectattr('value','search','media=cdrom') | map(attribute='key') | list }}"
    _virtio_disks: "{{ _cfg | dict2items | selectattr('key','match','^virtio[0-9]+$') | rejectattr('value','search','cloudinit') | rejectattr('value','search','media=cdrom') | map(attribute='key') | list }}"
    _sata_disks:  "{{ _cfg | dict2items | selectattr('key','match','^sata[0-9]+$')  | rejectattr('value','search','cloudinit') | rejectattr('value','search','media=cdrom') | map(attribute='key') | list }}"
    _nvme_disks:  "{{ _cfg | dict2items | selectattr('key','match','^nvme[0-9]+$')  | rejectattr('value','search','cloudinit') | rejectattr('value','search','media=cdrom') | map(attribute='key') | list }}"
    _ide_disks:   "{{ _cfg | dict2items | selectattr('key','match','^ide[0-9]+$')   | rejectattr('value','search','cloudinit') | rejectattr('value','search','media=cdrom') | map(attribute='key') | list }}"
    _boot_disk: >-
      {{
        (_scsi_disks | first)  if (_scsi_disks  | length) > 0 else
        ((_virtio_disks | first) if (_virtio_disks | length) > 0 else
        ((_sata_disks | first)  if (_sata_disks  | length) > 0 else
        ((_nvme_disks | first)  if (_nvme_disks  | length) > 0 else
        ((_ide_disks | first)   if (_ide_disks   | length) > 0 else ''))))
      }}
  loop: "{{ _clone_cfg2.results }}"
  changed_when: false

# ----- Wait and start --------------------------------------------------------

- name: Clone | Wait for cloned VMs to appear in Proxmox inventory
  community.proxmox.proxmox_vm_info:
    api_host:         "{{ pve_api_host }}"
    api_port:         "{{ pve_api_port | default(8006) }}"
    api_user:         "{{ pve_api_user }}"
    api_token_id:     "{{ pve_api_token_id }}"
    api_token_secret: "{{ pve_api_token_secret }}"
    validate_certs:   "{{ pve_validate_certs | default(false) }}"
    type: qemu
    vmid: "{{ item.vmid }}"
  register: _wait_vm
  until: (_wait_vm.proxmox_vms | default([]) | length) == 1
  retries: 30
  delay: 5
  loop: "{{ pve_clone_plan }}"
  changed_when: false

- name: Clone | Start cloned VMs flagged for auto-start
  community.proxmox.proxmox_kvm:
    api_host:         "{{ pve_api_host }}"
    api_port:         "{{ pve_api_port | default(8006) }}"
    api_user:         "{{ pve_api_user }}"
    api_token_id:     "{{ pve_api_token_id }}"
    api_token_secret: "{{ pve_api_token_secret }}"
    validate_certs:   "{{ pve_validate_certs | default(false) }}"
    node:    "{{ item.target_node }}"
    vmid:    "{{ item.vmid }}"
    state:   started
    timeout: "{{ pve_timeout | default(300) }}"
  loop: "{{ pve_clone_plan }}"
  when: item.autostart | default(false) | bool
