---
# =============================================================================
# roles/proxmox-vm/defaults/main.yml
#
# Canonical defaults for the proxmox-vm role.
# All variables use the pve_* namespace directly — no aliasing.
#
# Override priority (highest → lowest):
#   extra-vars > host_vars > group_vars/<group> > group_vars/all > here
# =============================================================================

# ===== Proxmox API =====
pve_api_host: "walnut"
pve_api_port: 8006
pve_api_user: "ansible@pve"

# Token name only — used by community.proxmox modules
pve_api_token_name: "ansible-maint001"
pve_api_token_id: "{{ pve_api_token_name }}"

# Full "user@realm!tokenname" — used in raw REST Authorization headers
pve_api_token_full_id: "{{ pve_api_user }}!{{ pve_api_token_name }}"

# pve_api_token_secret comes from vault only — never committed
pve_validate_certs: false
pve_timeout: 300

# ===== Internal computed vars (do not override) =====
pve_node:  "{{ inventory_hostname_short }}"
pve_vmids: "{{ pve_vm_map[inventory_hostname_short] | default([]) }}"

# ===== VM State =====
# pve_vm_state: null  — define in playbook or extra-vars; leave undefined to skip
# pve_vm_map: {}       — define in playbook: {walnut: [151, 152]}

# ===== VM Clone =====
pve_clone_enabled:       false
pve_clone_template_id:   9000
pve_clone_template_name: "ubuntu-cloudinit"
pve_clone_storage:       "mydata"
pve_clone_format:        "qcow2"
pve_clone_pool:          ""
pve_clone_full:          true
pve_clone_timeout:       900
pve_clone_disk_size:     100  # GB, used only if template clone has no disk

# Target node for clone operations (defaults to pve_api_host)
pve_clone_target_node: "{{ pve_api_host }}"

# Resolved list of clone targets — override to target a different group
pve_clone_targets: "{{ groups['pve_vm_to_clone'] | default([]) }}"

# ===== VM Create from Scratch =====
pve_create_enabled: false

# List of FQDNs to create, e.g. ['elastic001.aaron.lan']
# Falls back to inventory group 'pve_vm_to_create' if empty
pve_create_vm: []

# Target node for create operations
pve_create_target_node: "{{ pve_api_host }}"

# Hardware
pve_create_cores:   2
pve_create_sockets: 1
pve_create_memory:  2048    # MB
pve_create_cpu:     "host"

# BIOS / machine
pve_create_bios:    "seabios"   # ovmf for UEFI
pve_create_machine: "q35"
pve_create_boot:    "order=scsi0;ide2;net0"
pve_create_ostype:  "l26"       # l26=Linux 2.6+, win10, win11, etc.

# Storage
pve_create_storage:   "local-lvm"
pve_create_disk_size: 32         # GB — integer only, no 'G' suffix
pve_create_scsihw:    "virtio-scsi-single"

# Network
pve_create_bridge: "vmbr1"
pve_create_vlan:   "29"
pve_create_prefix: 24
pve_create_gateway: "192.168.1.1"

# ISO / CDROM — leave empty for no ISO
pve_create_iso: ""

# Misc options
pve_create_agent:      "enabled=1"
pve_create_onboot:     false
pve_create_protection: false
pve_create_tags:       ""
pve_create_pool:       ""
pve_create_autostart:  false
pve_create_timeout:    300

# ===== Cloud-Init =====
pve_create_use_cloudinit: false
pve_create_ciuser:        ""
pve_create_cipassword:    ""   # set in vault: pve_new_vm_cipassword
pve_create_sshkeys:       ""   # URL-encoded SSH public key(s)
