---
- name: Skip clone workflow when disabled
  ansible.builtin.debug:
    msg: "pve_clone_enabled=false; skipping clone workflow."
  when: not (pve_clone_enabled | default(true) | bool)

- name: End play when clone workflow is disabled
  ansible.builtin.meta: end_play
  when: not (pve_clone_enabled | default(true) | bool)

- name: Determine clone targets list
  ansible.builtin.set_fact:
    pve_clone_targets_resolved: "{{ pve_clone_targets }}"

- name: Assert clone targets list is not empty
  ansible.builtin.assert:
    that:
      - (pve_clone_targets_resolved | length) > 0
    fail_msg: >-
      No clone targets found. Set pve_clone_vm list in playbook
      or populate inventory group 'pve_vm_to_clone'.

- name: Assert required per-host inventory vars exist
  ansible.builtin.assert:
    that:
      - hostvars[item].ansible_host is defined
      - hostvars[item].pve_vmid is defined
    fail_msg: "{{ item }} must define ansible_host and pve_vmid in inventory"
  loop: "{{ pve_clone_targets_resolved }}"

- name: Assert required network vars exist (from inventory or group_vars or playbook)
  ansible.builtin.assert:
    that:
      - (hostvars[item].pve_create_prefix is defined) or (pve_create_prefix is defined) or (hostvars[item].pve_prefix is defined)
      - (hostvars[item].pve_create_gateway is defined) or (pve_create_gateway is defined) or (hostvars[item].pve_gateway is defined)
    fail_msg: "{{ item }} must have pve_create_prefix/pve_prefix and pve_create_gateway/pve_gateway defined (in inventory, group_vars, or playbook vars)"
  loop: "{{ pve_clone_targets_resolved }}"

- name: Query Proxmox cluster nodes
  ansible.builtin.uri:
    url: "https://{{ pve_api_host }}:{{ pve_api_port | default(8006) }}/api2/json/nodes"
    method: GET
    validate_certs: "{{ pve_validate_certs | default(false) }}"
    return_content: true
    status_code: [200]
    headers:
      Authorization: "PVEAPIToken={{ pve_api_token_full_id }}={{ pve_api_token_secret }}"
  register: pve_nodes_resp
  changed_when: false
  no_log: true

- name: Extract cluster node names
  ansible.builtin.set_fact:
    pve_cluster_nodes: "{{ (pve_nodes_resp.json.data | default([])) | map(attribute='node') | list }}"

- name: Set default target node fallback
  ansible.builtin.set_fact:
    pve_clone_default_target_node: "{{ pve_clone_target_node | default(pve_api_host) }}"

- name: Assert default target node exists in the cluster
  ansible.builtin.assert:
    that:
      - pve_clone_default_target_node in pve_cluster_nodes
    fail_msg: "Default target node '{{ pve_clone_default_target_node }}' not in nodes {{ pve_cluster_nodes }}."

- name: Verify template exists
  community.proxmox.proxmox_vm_info:
    api_host: "{{ pve_api_host }}"
    api_port: "{{ pve_api_port | default(8006) }}"
    api_user: "{{ pve_api_user }}"
    api_token_id: "{{ pve_api_token_id }}"
    api_token_secret: "{{ pve_api_token_secret }}"
    validate_certs: "{{ pve_validate_certs | default(false) }}"
    type: qemu
    vmid: "{{ pve_clone_template_id }}"
  register: template_info

- name: Assert template exists and is a template
  ansible.builtin.assert:
    that:
      - (template_info.proxmox_vms | length) == 1
      - template_info.proxmox_vms[0].template | bool
    fail_msg: "Template VMID {{ pve_clone_template_id }} does not exist or is not a template"

- name: Initialize clone plan list
  ansible.builtin.set_fact:
    pve_clone_plan: []

- name: Build clone plan for each target
  ansible.builtin.set_fact:
    pve_clone_plan: >-
      {{
        pve_clone_plan + [
          {
            'host': item,
            'vmid': hostvars[item].pve_vmid | int,
            'target_node': (
              hostvars[item].pve_clone_target_node
              | default(hostvars[item].clone_target_node)
              | default(pve_clone_default_target_node)
            ),
            'storage': (
              hostvars[item].pve_clone_storage
              | default(pve_clone_storage)
            ),
            'format': (
              hostvars[item].pve_clone_format
              | default(pve_clone_format)
            ),
            'pool': (
              hostvars[item].pve_pool
              | default(pve_clone_pool)
            ),
            'full': (
              hostvars[item].pve_clone_full
              | default(pve_clone_full)
            ) | bool,
            'ipconfig': (
              hostvars[item].pve_ipconfig
              | default(
                {'ipconfig0': 'ip=' + hostvars[item].ansible_host + '/' + ((hostvars[item].pve_prefix | default(hostvars[item].pve_create_prefix) | default(pve_create_prefix)) | string) + ',gw=' + (hostvars[item].pve_gateway | default(hostvars[item].pve_create_gateway) | default(pve_create_gateway))}
              )
            ) if pve_create_use_cloudinit | default(false) | bool else {},
            'ciuser': (
              hostvars[item].pve_ciuser
              | default(pve_create_ciuser)
            ) if pve_create_use_cloudinit | default(false) | bool else '',
            'cipassword': (
              hostvars[item].pve_cipassword
              | default(pve_create_cipassword)
            ) if pve_create_use_cloudinit | default(false) | bool else '',
            'sshkeys': (
              hostvars[item].pve_sshkeys
              | default(pve_create_sshkeys)
            ) if pve_create_use_cloudinit | default(false) | bool else '',
            'tags': (
              hostvars[item].pve_tags
              | default(pve_create_tags)
            ),
            'autostart': (
              hostvars[item].pve_autostart
              | default(pve_create_autostart)
            ) | bool
          }
        ]
      }}
  loop: "{{ pve_clone_targets_resolved }}"

- name: Assert computed VMIDs are unique
  ansible.builtin.assert:
    that:
      - (pve_clone_plan | map(attribute='vmid') | list) | length
        == ((pve_clone_plan | map(attribute='vmid') | list) | unique | length)
    fail_msg: "Duplicate VMIDs in clone plan: {{ pve_clone_plan | map(attribute='vmid') | list }}"

- name: Assert each target node exists in the cluster
  ansible.builtin.assert:
    that:
      - item.target_node in pve_cluster_nodes
    fail_msg: "Target node '{{ item.target_node }}' for '{{ item.host }}' not in nodes {{ pve_cluster_nodes }}."
  loop: "{{ pve_clone_plan }}"

- name: Show resolved clone plan
  ansible.builtin.debug:
    msg:
      plan: "{{ pve_clone_plan }}"