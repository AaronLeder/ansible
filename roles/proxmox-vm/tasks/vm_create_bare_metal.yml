---
- name: Check whether target VMIDs already exist in Proxmox
  community.proxmox.proxmox_vm_info:
    api_host: "{{ pve_api_host }}"
    api_port: "{{ pve_api_port | default(8006) }}"
    api_user: "{{ pve_api_user }}"
    api_token_id: "{{ pve_api_token_id }}"
    api_token_secret: "{{ pve_api_token_secret }}"
    api_password: "{{ pve_api_password | default(omit) }}"
    validate_certs: "{{ pve_validate_certs | default(false) }}"
    type: qemu
    vmid: "{{ item.vmid }}"
  loop: "{{ pve_create_plan }}"
  register: vmid_info

- name: Fail if any target VMID already exists
  ansible.builtin.assert:
    that:
      - (item.proxmox_vms | default([]) | length) == 0
    fail_msg: >-
      VMID {{ item.item.vmid }} for {{ item.item.host }} already exists in Proxmox.
      Choose a different pve_vmid or adjust pve_create_vmid_start.
  loop: "{{ vmid_info.results }}"

- name: Create new VMs from scratch
  community.proxmox.proxmox_kvm:
    api_host: "{{ pve_api_host }}"
    api_port: "{{ pve_api_port | default(8006) }}"
    api_user: "{{ pve_api_user }}"
    api_token_id: "{{ pve_api_token_id }}"
    api_token_secret: "{{ pve_api_token_secret }}"
    api_password: "{{ pve_api_password | default(omit) }}"
    validate_certs: "{{ pve_validate_certs | default(false) }}"

    node: "{{ item.target_node }}"
    vmid: "{{ item.vmid }}"
    name: "{{ item.host }}"

    cores: "{{ item.cores }}"
    sockets: "{{ item.sockets }}"
    memory: "{{ item.memory }}"
    cpu: "{{ item.cpu }}"

    bios: "{{ item.bios }}"
    machine: "{{ item.machine }}"
    boot: "{{ item.boot }}"

    ostype: "{{ item.ostype }}"

    scsi: "{{ item.scsi }}"
    scsihw: "{{ item.scsihw }}"

    net: "{{ item.net }}"

    ide: "{{ item.ide if ((item.ide | default('') | string | length) > 0) else omit }}"

    agent: "{{ item.agent }}"
    onboot: "{{ item.onboot }}"
    protection: "{{ item.protection }}"
    tags: "{{ item.tags if ((item.tags | default('') | string | length) > 0) else omit }}"
    pool: "{{ item.pool if ((item.pool | default('') | string | length) > 0) else omit }}"

    ipconfig: "{{ item.ipconfig if item.ipconfig is defined else omit }}"
    ciuser: "{{ item.ciuser if ((item.ciuser | default('') | string | length) > 0) else omit }}"
    cipassword: "{{ item.cipassword if ((item.cipassword | default('') | string | length) > 0) else omit }}"
    sshkeys: "{{ item.sshkeys if ((item.sshkeys | default('') | string | length) > 0) else omit }}"

    state: present
    timeout: "{{ pve_create_timeout | default(300) }}"
  loop: "{{ pve_create_plan }}"
  register: create_result

- name: Ensure boot disk and cloud-init drive are attached, and boot order is correct
  community.proxmox.proxmox_kvm:
    api_host: "{{ pve_api_host }}"
    api_port: "{{ pve_api_port | default(8006) }}"
    api_user: "{{ pve_api_user }}"
    api_token_id: "{{ pve_api_token_id }}"
    api_token_secret: "{{ pve_api_token_secret }}"
    api_password: "{{ pve_api_password | default(omit) }}"
    validate_certs: "{{ pve_validate_certs | default(false) }}"

    node: "{{ item.target_node }}"
    vmid: "{{ item.vmid }}"

    scsihw: "{{ item.scsihw }}"
    scsi: "{{ item.scsi }}"
    ide: "{{ item.ide if ((item.ide | default({})) | length) > 0 else omit }}"
    boot: "{{ item.boot | default('order=scsi0;ide2;net0') }}"

    update: true
    timeout: "{{ pve_create_timeout | default(300) }}"
  loop: "{{ pve_create_plan }}"
  register: create_postfix_result

- name: Read VM config from Proxmox API (post-create verification)
  ansible.builtin.uri:
    url: "https://{{ pve_api_host }}:{{ pve_api_port | default(8006) }}/api2/json/nodes/{{ item.target_node }}/qemu/{{ item.vmid }}/config"
    method: GET
    validate_certs: "{{ pve_validate_certs | default(false) }}"
    return_content: true
    status_code: [200]
    headers:
      Authorization: "PVEAPIToken={{ (pve_api_token_full_id | default(pve_api_user ~ '!' ~ pve_api_token_id)) }}={{ pve_api_token_secret }}"
  loop: "{{ pve_create_plan }}"
  register: pve_vm_cfg
  changed_when: false
  no_log: true

- name: Assert scsi0 exists and boot order includes scsi0
  ansible.builtin.assert:
    that:
      - (item.json.data.scsi0 is defined) or (item.json.data.virtio0 is defined) or (item.json.data.sata0 is defined)
      - (item.json.data.boot is defined) and ('scsi0' in (item.json.data.boot | string) or 'virtio0' in (item.json.data.boot | string) or 'sata0' in (item.json.data.boot | string))
    fail_msg: >-
      VMID {{ item.item.vmid }} on {{ item.item.target_node }} still does not have a valid disk/boot order.
      Disk keys seen: scsi0={{ item.json.data.scsi0 | default('') }}, virtio0={{ item.json.data.virtio0 | default('') }}, sata0={{ item.json.data.sata0 | default('') }};
      boot={{ item.json.data.boot | default('') }}
  loop: "{{ pve_vm_cfg.results }}"

- name: Wait until created VMs appear in Proxmox inventory
  community.proxmox.proxmox_vm_info:
    api_host: "{{ pve_api_host }}"
    api_port: "{{ pve_api_port | default(8006) }}"
    api_user: "{{ pve_api_user }}"
    api_token_id: "{{ pve_api_token_id }}"
    api_token_secret: "{{ pve_api_token_secret }}"
    validate_certs: "{{ pve_validate_certs | default(false) }}"
    type: qemu
    vmid: "{{ item.vmid }}"
  register: wait_vm
  until: (wait_vm.proxmox_vms | default([]) | length) == 1
  retries: 30
  delay: 5
  loop: "{{ pve_create_plan }}"
  changed_when: false

- name: Start created VMs (if configured to auto-start)
  community.proxmox.proxmox_kvm:
    api_host: "{{ pve_api_host }}"
    api_port: "{{ pve_api_port | default(8006) }}"
    api_user: "{{ pve_api_user }}"
    api_token_id: "{{ pve_api_token_id }}"
    api_token_secret: "{{ pve_api_token_secret }}"
    validate_certs: "{{ pve_validate_certs | default(false) }}"
    node: "{{ item.target_node }}"
    vmid: "{{ item.vmid }}"
    state: started
    timeout: "{{ pve_timeout | default(300) }}"
  loop: "{{ pve_create_plan }}"
  when: item.autostart | default(false) | bool