---
# =============================================================================
# inventory/group_vars/dev/main.yml
# =============================================================================

pve_create_prefix:  24
pve_create_gateway: "192.168.35.1"
pve_bridge:         "vmbr1"
pve_vlan:           "35"

pve_clone_template_id:   9000
pve_clone_template_name: "ubuntu-cloudinit"
pve_clone_storage:       "mydata"
pve_clone_format:        "qcow2"
pve_clone_full:          true
pve_clone_target_node:   "walnut"

pve_cores:   2
pve_sockets: 1
pve_memory:  2048
pve_cpu:     "host"

pve_disk_size: 32
pve_scsihw:    "virtio-scsi-single"

pve_create_use_cloudinit: true
pve_ciuser: "ansible"

pve_tags:       "dev"
pve_onboot:     false   # dev VMs do not auto-start on host boot
pve_protection: false
pve_agent:      "enabled=1"
pve_autostart:  false
