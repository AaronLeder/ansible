---
# =============================================================================
# inventory/group_vars/dev/main.yml
#
# Applies to development / scratch VMs.
# Smaller resources, no autostart, no onboot — intentionally ephemeral.
# =============================================================================

# ===== Network ===== #
# VLAN 35 — Dev subnet (192.168.35.0/24)
pve_create_bridge:  "vmbr1"
pve_create_vlan:    "35"
pve_create_prefix:  24
pve_create_gateway: "192.168.35.1"

# ===== Template ===== #
pve_clone_template_id:   9020
pve_clone_template_name: "dev-ubuntu-cloudinit"
pve_clone_target_node:   "walnut"

pve_clone_storage: "mydata"
pve_clone_format:  "qcow2"
pve_clone_full:    true

# ===== Hardware ===== #
pve_cores:   2
pve_sockets: 1
pve_memory:  8192     # MB
pve_cpu:     "host"

# ===== Storage ===== #
pve_disk_size: 100    # GB
pve_scsihw:    "virtio-scsi-single"

# ===== Cloud-Init ===== #
pve_create_use_cloudinit: true
pve_ciuser: "ansible"

# ===== VM Options ===== #
pve_tags:       "dev"
pve_onboot:     false   # Dev VMs do not survive host reboots automatically
pve_protection: false
pve_agent:      "enabled=1"
pve_autostart:  false   # Do not start after cloning — start manually when needed
