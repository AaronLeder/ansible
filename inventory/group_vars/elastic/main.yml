---
# =============================================================================
# inventory/group_vars/elastic/main.yml
#
# Applies to all hosts in the [elastic] inventory group.
# Defines network, template, hardware, and cloud-init defaults for
# Elasticsearch data/master nodes.
#
# Per-VM overrides (different node, extra RAM, dedicated key) go in
# host_vars/<hostname>.yml.
# =============================================================================

# ===== Network ===== #
# VLAN 30 — Elasticsearch stack subnet (192.168.30.0/24)
pve_create_bridge:  "vmbr1"
pve_create_vlan:    "30"
pve_create_prefix:  24
pve_create_gateway: "192.168.30.1"

# ===== Template ===== #
# Use the pre-built Proxmox template for elastic nodes.
# This template can be maintained manually from an ISO inside Proxmox and then
# cloned by VMID/name from this group.
pve_clone_template_id:   9000
pve_clone_template_name: "elastic-template"
pve_clone_target_node:   "walnut"

# Optional installer ISO selector for scratch/ISO-based builds on Proxmox.
# The role resolves this to "local:iso/<name>" when pve_create_enabled=true.
pve_create_iso_storage: "local"
pve_create_iso_name: "ubuntu-26.04-live-server-amd64.iso"

# ===== Clone Storage ===== #
pve_clone_storage: "mydata"
pve_clone_format:  "qcow2"
pve_clone_full:    true

# ===== Hardware ===== #
pve_cores:   4
pve_sockets: 1
pve_memory:  8192     # MB
pve_cpu:     "host"

# ===== Storage ===== #
pve_disk_size: 100    # GB
pve_scsihw:    "virtio-scsi-single"

# ===== Cloud-Init ===== #
pve_create_use_cloudinit: true
pve_ciuser: "ansible"
# pve_create_cipassword — wired from vault via group_vars/all/main.yml
# pve_create_sshkeys    — wired from vault via group_vars/all/main.yml

# ===== VM Options ===== #
pve_tags:       "elasticsearch,elastic-cluster,production"
pve_onboot:     true
pve_protection: false
pve_agent:      "enabled=1"
pve_autostart:  true
