---
# =============================================================================
# inventory/group_vars/elastic/main.yml
#
# Applies to all hosts in the [elastic] inventory group.
# Uses pve_* vars directly — no aliasing layer.
#
# These are consumed by the proxmox-vm role when creating or cloning
# elasticsearch nodes.
# =============================================================================

# ===== Network =====
pve_create_prefix:  24
pve_create_gateway: "192.168.30.1"
pve_bridge:         "vmbr1"
pve_vlan:           "30"

# ===== Clone settings =====
pve_clone_template_id:   9000
pve_clone_template_name: "elastic-ubuntu-cloudinit"
pve_clone_storage:       "mydata"
pve_clone_format:        "qcow2"
pve_clone_full:          true
pve_clone_target_node:   "walnut"

# ===== Hardware =====
pve_cores:   4
pve_sockets: 1
pve_memory:  8192     # MB
pve_cpu:     "host"

# ===== Storage =====
pve_disk_size: 100    # GB
pve_scsihw:    "virtio-scsi-single"

# ===== Cloud-Init =====
pve_create_use_cloudinit: true
pve_ciuser: "ansible"
# pve_cipassword — sourced from vault: pve_new_vm_cipassword
# pve_sshkeys    — set per-host in host_vars or pass via extra-vars

# ===== VM options =====
pve_tags:       "elasticsearch,elastic-cluster,production"
pve_onboot:     true
pve_protection: false
pve_agent:      "enabled=1"
pve_autostart:  true
