---
# =============================================================================
# inventory/group_vars/logstash/main.yml
#
# Applies to all hosts in the [logstash] inventory group.
# =============================================================================

# ===== Network ===== #
# VLAN 30 — Elasticsearch stack subnet (192.168.30.0/24)
pve_create_bridge:  "vmbr1"
pve_create_vlan:    "30"
pve_create_prefix:  24
pve_create_gateway: "192.168.30.1"

# ===== Template ===== #
pve_clone_template_id:   9002
pve_clone_template_name: "logstash-ubuntu-cloudinit"
pve_clone_target_node:   "walnut"

pve_clone_storage: "mydata"
pve_clone_format:  "qcow2"
pve_clone_full:    true

# for creating new templates, can override with;
# ansible-playbook playbooks/proxmox_vm_clone.yml \
#   -i inventory/master_hosts.yml \
#   -e "pve_clone_enabled=true" \
#   -e "pve_clone_template_id=9000" \
#   -e "pve_clone_template_name=logstash-ubuntu-cloudinit" \
#   --ask-vault-pass
pve_clone_template_id:   9002
pve_clone_template_name: "logstash-ubuntu-cloudinit"

# ===== Hardware ===== #
# Logstash is CPU and memory intensive — more cores than kibana
pve_cores:   4
pve_sockets: 1
pve_memory:  8192     # MB
pve_cpu:     "host"

# ===== Storage ===== #
pve_disk_size: 100    # GB — logstash may buffer to disk under load
pve_scsihw:    "virtio-scsi-single"

# ===== Cloud-Init ===== #
pve_create_use_cloudinit: true
pve_ciuser: "ansible"

# ===== VM Options ===== #
pve_tags:       "logstash,elasticsearch,production"
pve_onboot:     true
pve_protection: false
pve_agent:      "enabled=1"
pve_autostart:  true

# ===== PKI ===== #
pki_profile_name: elastic
pki_output_dir: "{{ playbook_dir }}/certificates/elastic"

pki_generate_ca: true
pki_generate_host_certs: true

pki_ca_common_name: "Elastic Local CA"

# Standard SANs for all Elastic hosts.
# This assumes inventory_hostname, ansible_hostname, ansible_fqdn, and ansible_host
# are valid names/IPs clients may use to reach the node.
pki_host_subject_alt_names:
  - "DNS:{{ inventory_hostname }}"
  - "DNS:{{ ansible_hostname | default(inventory_hostname) }}"
  - "DNS:{{ ansible_fqdn | default(inventory_hostname) }}"
  - "IP:{{ ansible_host }}"

# Optional per-host additions.
# Define this in host_vars only when a host has extra aliases, VIPs, or alternate names.
pki_host_extra_subject_alt_names: []