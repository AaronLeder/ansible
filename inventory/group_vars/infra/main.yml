---
# =============================================================================
# inventory/group_vars/infra/main.yml
#
# Applies to infrastructure VMs (maint001, maint002, etc.)
# These sit on VLAN 29, the management network.
# =============================================================================

# ===== Network ===== #
# VLAN 29 — Management/infrastructure subnet (192.168.29.0/24)
pve_create_bridge:  "vmbr1"
pve_create_vlan:    "29"
pve_create_prefix:  24
pve_create_gateway: "192.168.29.1"

# ===== Template ===== #
pve_clone_template_id:   9010
pve_clone_template_name: "infra-ubuntu-cloudinit"
pve_clone_target_node:   "walnut"

pve_clone_storage: "mydata"
pve_clone_format:  "qcow2"
pve_clone_full:    true

# ===== Hardware ===== #
pve_cores:   2
pve_sockets: 1
pve_memory:  8192     # MB
pve_cpu:     "host"

# ===== Storage ===== #
pve_disk_size: 100    # GB
pve_scsihw:    "virtio-scsi-single"

# ===== Cloud-Init ===== #
pve_create_use_cloudinit: true
pve_ciuser: "ansible"

# ===== VM Options ===== #
pve_tags:       "infra,production"
pve_onboot:     true
pve_protection: false
pve_agent:      "enabled=1"
pve_autostart:  true

# ===== PKI Vars ===== #
# The way I have these variables below assumes they are the SAME
# as the existing hostname and IP address. Redundancy never hurts.
pki_host_extra_subject_alt_names:
  - "DNS:{{ inventory_hostname }}"
  - "DNS:{{ ansible_hostname | default(inventory_hostname) }}"
  - "DNS:{{ ansible_fqdn | default(inventory_hostname) }}"
  - "IP:{{ ansible_host }}"