---
# =============================================================================
# inventory/master_hosts.yml
#
# Groups only — per-host ansible_host and pve_vmid live in host_vars/.
# Per-group defaults (network, hardware, cloud-init) live in group_vars/.
#
# Group structure:
#   proxmox        — hypervisor API targets (VM state operations)
#   elastic        — Elasticsearch data/master nodes
#   kibana         — Kibana + Fleet nodes
#   logstash       — Logstash nodes
#   fleet          — Fleet Server (alias of kibana; same hosts)
#   elasticsearch  — Parent group: elastic + kibana + logstash + fleet
#   infra          — Infrastructure VMs (maint, jump, etc.)
#   dev            — Development / scratch VMs
#   school         — School lab VMs (separate VLAN/gateway)
#   pve_vm_to_clone  — Dynamic target list for the clone workflow
# =============================================================================

all:
  children:

    # ===== Proxmox Hypervisors ===== #
    proxmox:
      hosts:
        walnut.aaron.lan:
        rainbow.aaron.lan:
        cheddar.aaron.lan:
        squeak.aaron.lan:

    # ===== Infrastructure ===== #
    infra:
      hosts:
        maint00[1:2].aaron.lan:

    # ===== Elasticsearch Stack ===== #
    elastic:
      hosts:
        elastic00[1:3].aaron.lan:

    logstash:
      hosts:
        logstash001.aaron.lan:

    kibana:
      hosts:
        kibana001.aaron.lan:

    fleet:
      hosts:
        kibana001.aaron.lan:

    agent:
      hosts:
        elastic00[1:3].aaron.lan:

    elasticsearch:
      children:
        elastic:
        kibana:
        logstash:
        fleet:
        agent:

    # ===== Dev ===== #
    dev:
      hosts:
        ubuntu00[1:5].dev.pve:

    # ===== School ===== #
    # School hosts sit on a separate VLAN (192.168.1.0/24) — override
    # network vars in host_vars if they differ from infra defaults.
    school:
      hosts:
        digfor-pve:
        appsec-pve:

    # ===== Clone Targets ===== #
    # Default group consumed by the clone workflow when pve_clone_targets
    # is not overridden. Populate with whichever hosts you want cloned in
    # the current run, then clear it afterwards.
    #
    # Alternatively, override pve_clone_targets in the playbook or via
    # extra-vars to target a specific group without editing this file:
    #   -e '{"pve_clone_targets": "{{ groups[\"elastic\"] }}"}'
    pve_vm_to_clone:
      hosts:
        elastic001.aaron.lan:
