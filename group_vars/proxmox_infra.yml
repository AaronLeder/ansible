---
# ===== Infrastructure Cloud-Init Clone Configuration ===== #
# This file defines clone settings for the 'infra' inventory group
# Hosts: maint001.aaron.lan, maint002.aaron.lan

# ===== Network Configuration ===== #
infra_prefix: 24
infra_gateway: 192.168.29.1
infra_bridge: "vmbr1"
infra_vlan: "29"

# Apply to all hosts in infra group
pve_create_prefix: "{{ infra_prefix }}"
pve_create_gateway: "{{ infra_gateway }}"
pve_bridge: "{{ infra_bridge }}"
pve_vlan: "{{ infra_vlan }}"

# ===== Clone Template Configuration ===== #
infra_clone_template_id: 9000
infra_clone_template_name: "elastic-ubuntu-cloudinit"
infra_clone_storage: "mydata"
infra_clone_format: "qcow2"
infra_clone_full: true

# Apply template settings
pve_clone_template_id: "{{ infra_clone_template_id }}"
pve_clone_storage: "{{ infra_clone_storage }}"
pve_clone_format: "{{ infra_clone_format }}"
pve_clone_full: "{{ infra_clone_full }}"

# ===== Hardware Configuration ===== #
infra_cores: 2
infra_sockets: 1
infra_memory: 4096  # MB
infra_cpu: "host"

# Apply hardware settings
pve_cores: "{{ infra_cores }}"
pve_sockets: "{{ infra_sockets }}"
pve_memory: "{{ infra_memory }}"
pve_cpu: "{{ infra_cpu }}"

# ===== Storage Configuration ===== #
infra_disk_size: 50  # GB
infra_scsihw: "virtio-scsi-single"

pve_disk_size: "{{ infra_disk_size }}"
pve_scsihw: "{{ infra_scsihw }}"

# ===== Cloud-Init Configuration ===== #
infra_ciuser: "ansible"
# Password comes from vault: pve_new_vm_cipassword

pve_create_use_cloudinit: true
pve_ciuser: "{{ infra_ciuser }}"

# ===== VM Options ===== #
infra_tags: "infrastructure,maintenance,production"
infra_onboot: true
infra_protection: false
infra_agent: "enabled=1"
infra_autostart: true

pve_tags: "{{ infra_tags }}"
pve_onboot: "{{ infra_onboot }}"
pve_protection: "{{ infra_protection }}"
pve_agent: "{{ infra_agent }}"
pve_autostart: "{{ infra_autostart }}"

# ===== Target Node Configuration ===== #
# Default node for infrastructure VMs
infra_target_node: "walnut"

pve_clone_target_node: "{{ infra_target_node }}"

# ===== Notes ===== #
# To clone infra nodes, run:
# ansible-playbook playbooks/proxmox.yml --tags pve_clone_vm -e "pve_clone_targets={{ groups['infra'] }}" -i inventory/master_hosts.yml
#
# Or set pve_clone_targets in proxmox.yml:
# pve_clone_targets: "{{ groups['infra'] | default([]) }}"