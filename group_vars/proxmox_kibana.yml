---
# ===== Kibana Cloud-Init Clone Configuration ===== #
# This file defines clone settings for the 'kibana' inventory group
# Hosts: kibana001.aaron.lan

# ===== Network Configuration ===== #
kibana_prefix: 24
kibana_gateway: 192.168.30.1
kibana_bridge: "vmbr1"
kibana_vlan: "30"

# Apply to all hosts in kibana group
pve_create_prefix: "{{ kibana_prefix }}"
pve_create_gateway: "{{ kibana_gateway }}"
pve_bridge: "{{ kibana_bridge }}"
pve_vlan: "{{ kibana_vlan }}"

# ===== Clone Template Configuration ===== #
kibana_clone_template_id: 9000
kibana_clone_template_name: "elastic-ubuntu-cloudinit"
kibana_clone_storage: "mydata"
kibana_clone_format: "qcow2"
kibana_clone_full: true

# Apply template settings
pve_clone_template_id: "{{ kibana_clone_template_id }}"
pve_clone_storage: "{{ kibana_clone_storage }}"
pve_clone_format: "{{ kibana_clone_format }}"
pve_clone_full: "{{ kibana_clone_full }}"

# ===== Hardware Configuration ===== #
kibana_cores: 2
kibana_sockets: 1
kibana_memory: 4096  # MB
kibana_cpu: "host"

# Apply hardware settings
pve_cores: "{{ kibana_cores }}"
pve_sockets: "{{ kibana_sockets }}"
pve_memory: "{{ kibana_memory }}"
pve_cpu: "{{ kibana_cpu }}"

# ===== Storage Configuration ===== #
kibana_disk_size: 50  # GB
kibana_scsihw: "virtio-scsi-single"

pve_disk_size: "{{ kibana_disk_size }}"
pve_scsihw: "{{ kibana_scsihw }}"

# ===== Cloud-Init Configuration ===== #
kibana_ciuser: "ansible"
# Password comes from vault: pve_new_vm_cipassword

pve_create_use_cloudinit: true
pve_ciuser: "{{ kibana_ciuser }}"

# ===== VM Options ===== #
kibana_tags: "kibana,elasticsearch-stack,production"
kibana_onboot: true
kibana_protection: false
kibana_agent: "enabled=1"
kibana_autostart: true

pve_tags: "{{ kibana_tags }}"
pve_onboot: "{{ kibana_onboot }}"
pve_protection: "{{ kibana_protection }}"
pve_agent: "{{ kibana_agent }}"
pve_autostart: "{{ kibana_autostart }}"

# ===== Target Node Configuration ===== #
# Default node for kibana
kibana_target_node: "walnut"

pve_clone_target_node: "{{ kibana_target_node }}"

# ===== Notes ===== #
# To clone kibana nodes, run:
# ansible-playbook playbooks/proxmox.yml --tags pve_clone_vm -e "pve_clone_targets={{ groups['kibana'] }}" -i inventory/master_hosts.yml
#
# Or set pve_clone_targets in proxmox.yml:
# pve_clone_targets: "{{ groups['kibana'] | default([]) }}"