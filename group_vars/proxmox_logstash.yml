---
# ===== Logstash Cloud-Init Clone Configuration ===== #
# This file defines clone settings for the 'logstash' inventory group
# Hosts: logstash001.aaron.lan

# ===== Network Configuration ===== #
logstash_prefix: 24
logstash_gateway: 192.168.30.1
logstash_bridge: "vmbr1"
logstash_vlan: "30"

# Apply to all hosts in logstash group
pve_create_prefix: "{{ logstash_prefix }}"
pve_create_gateway: "{{ logstash_gateway }}"
pve_bridge: "{{ logstash_bridge }}"
pve_vlan: "{{ logstash_vlan }}"

# ===== Clone Template Configuration ===== #
logstash_clone_template_id: 9000
logstash_clone_template_name: "elastic-ubuntu-cloudinit"
logstash_clone_storage: "mydata"
logstash_clone_format: "qcow2"
logstash_clone_full: true

# Apply template settings
pve_clone_template_id: "{{ logstash_clone_template_id }}"
pve_clone_storage: "{{ logstash_clone_storage }}"
pve_clone_format: "{{ logstash_clone_format }}"
pve_clone_full: "{{ logstash_clone_full }}"

# ===== Hardware Configuration ===== #
logstash_cores: 4
logstash_sockets: 1
logstash_memory: 8192  # MB
logstash_cpu: "host"

# Apply hardware settings
pve_cores: "{{ logstash_cores }}"
pve_sockets: "{{ logstash_sockets }}"
pve_memory: "{{ logstash_memory }}"
pve_cpu: "{{ logstash_cpu }}"

# ===== Storage Configuration ===== #
logstash_disk_size: 100  # GB
logstash_scsihw: "virtio-scsi-single"

pve_disk_size: "{{ logstash_disk_size }}"
pve_scsihw: "{{ logstash_scsihw }}"

# ===== Cloud-Init Configuration ===== #
logstash_ciuser: "ansible"
# Password comes from vault: pve_new_vm_cipassword

pve_create_use_cloudinit: true
pve_ciuser: "{{ logstash_ciuser }}"

# ===== VM Options ===== #
logstash_tags: "logstash,elasticsearch-stack,production"
logstash_onboot: true
logstash_protection: false
logstash_agent: "enabled=1"
logstash_autostart: true

pve_tags: "{{ logstash_tags }}"
pve_onboot: "{{ logstash_onboot }}"
pve_protection: "{{ logstash_protection }}"
pve_agent: "{{ logstash_agent }}"
pve_autostart: "{{ logstash_autostart }}"

# ===== Target Node Configuration ===== #
# Default node for logstash
logstash_target_node: "walnut"

pve_clone_target_node: "{{ logstash_target_node }}"

# ===== Notes ===== #
# To clone logstash nodes, run:
# ansible-playbook playbooks/proxmox.yml --tags pve_clone_vm -e "pve_clone_targets={{ groups['logstash'] }}" -i inventory/master_hosts.yml
#
# Or set pve_clone_targets in proxmox.yml:
# pve_clone_targets: "{{ groups['logstash'] | default([]) }}"