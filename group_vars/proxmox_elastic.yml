---
# ===== Proxmox Elasticsearch Cluster Cloud-Init Clone Configuration ===== #
# This file defines clone settings for the 'elastic' inventory group
# Hosts: elastic001.aaron.lan, elastic002.aaron.lan, elastic003.aaron.lan

# ===== Network Configuration ===== #
elastic_prefix: 24
elastic_gateway: 192.168.30.1
elastic_bridge: "vmbr1"
elastic_vlan: "30"

# Apply to all hosts in elastic group
pve_create_prefix: "{{ elastic_prefix }}"
pve_create_gateway: "{{ elastic_gateway }}"
pve_bridge: "{{ elastic_bridge }}"
pve_vlan: "{{ elastic_vlan }}"

# ===== Clone Template Configuration ===== #
elastic_clone_template_id: 9000
elastic_clone_template_name: "elastic-ubuntu-cloudinit"
elastic_clone_storage: "mydata"
elastic_clone_format: "qcow2"
elastic_clone_full: true

# Apply template settings
pve_clone_template_id: "{{ elastic_clone_template_id }}"
pve_clone_storage: "{{ elastic_clone_storage }}"
pve_clone_format: "{{ elastic_clone_format }}"
pve_clone_full: "{{ elastic_clone_full }}"

# ===== Hardware Configuration ===== #
elastic_cores: 4
elastic_sockets: 1
elastic_memory: 8192  # MB
elastic_cpu: "host"

# Apply hardware settings
pve_cores: "{{ elastic_cores }}"
pve_sockets: "{{ elastic_sockets }}"
pve_memory: "{{ elastic_memory }}"
pve_cpu: "{{ elastic_cpu }}"

# ===== Storage Configuration ===== #
elastic_disk_size: 100  # GB
elastic_scsihw: "virtio-scsi-single"

pve_disk_size: "{{ elastic_disk_size }}"
pve_scsihw: "{{ elastic_scsihw }}"

# ===== Cloud-Init Configuration ===== #
elastic_ciuser: "ansible"
# Password comes from vault: pve_new_vm_cipassword

pve_create_use_cloudinit: true
pve_ciuser: "{{ elastic_ciuser }}"

# ===== VM Options ===== #
elastic_tags: "elasticsearch,elastic-cluster,production"
elastic_onboot: true
elastic_protection: false
elastic_agent: "enabled=1"
elastic_autostart: true

pve_tags: "{{ elastic_tags }}"
pve_onboot: "{{ elastic_onboot }}"
pve_protection: "{{ elastic_protection }}"
pve_agent: "{{ elastic_agent }}"
pve_autostart: "{{ elastic_autostart }}"

# ===== Target Node Configuration ===== #
# Default node for elastic cluster
elastic_target_node: "walnut"

pve_clone_target_node: "{{ elastic_target_node }}"

# ===== Notes ===== #
# To clone all elastic nodes, run:
# ansible-playbook playbooks/proxmox.yml --tags pve_clone_vm -e "pve_clone_targets={{ groups['elastic'] }}" -i inventory/master_hosts.yml
#
# Or set pve_clone_targets in proxmox.yml:
# pve_clone_targets: "{{ groups['elastic'] | default([]) }}"