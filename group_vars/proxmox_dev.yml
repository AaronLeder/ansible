---
# ===== Development Environment Cloud-Init Clone Configuration ===== #
# This file defines clone settings for the 'dev' inventory group
# Hosts: ubuntu001-005.dev.pve

# ===== Network Configuration ===== #
dev_prefix: 24
dev_gateway: 192.168.35.1
dev_bridge: "vmbr1"
dev_vlan: "35"

# Apply to all hosts in dev group
pve_create_prefix: "{{ dev_prefix }}"
pve_create_gateway: "{{ dev_gateway }}"
pve_bridge: "{{ dev_bridge }}"
pve_vlan: "{{ dev_vlan }}"

# ===== Clone Template Configuration ===== #
dev_clone_template_id: 9000
dev_clone_template_name: "elastic-ubuntu-cloudinit"
dev_clone_storage: "mydata"
dev_clone_format: "qcow2"
dev_clone_full: false  # Use linked clones for dev to save space

# Apply template settings
pve_clone_template_id: "{{ dev_clone_template_id }}"
pve_clone_storage: "{{ dev_clone_storage }}"
pve_clone_format: "{{ dev_clone_format }}"
pve_clone_full: "{{ dev_clone_full }}"

# ===== Hardware Configuration ===== #
# Dev VMs typically need less resources
dev_cores: 2
dev_sockets: 1
dev_memory: 4096  # MB
dev_cpu: "host"

# Apply hardware settings
pve_cores: "{{ dev_cores }}"
pve_sockets: "{{ dev_sockets }}"
pve_memory: "{{ dev_memory }}"
pve_cpu: "{{ dev_cpu }}"

# ===== Storage Configuration ===== #
dev_disk_size: 50  # GB - smaller for dev environments
dev_scsihw: "virtio-scsi-single"

pve_disk_size: "{{ dev_disk_size }}"
pve_scsihw: "{{ dev_scsihw }}"

# ===== Cloud-Init Configuration ===== #
dev_ciuser: "ansible"
# Password comes from vault: pve_new_vm_cipassword

pve_create_use_cloudinit: true
pve_ciuser: "{{ dev_ciuser }}"

# ===== VM Options ===== #
dev_tags: "development,testing,non-production"
dev_onboot: false  # Don't auto-start dev VMs on boot
dev_protection: false
dev_agent: "enabled=1"
dev_autostart: false  # Don't auto-start dev VMs after clone

pve_tags: "{{ dev_tags }}"
pve_onboot: "{{ dev_onboot }}"
pve_protection: "{{ dev_protection }}"
pve_agent: "{{ dev_agent }}"
pve_autostart: "{{ dev_autostart }}"

# ===== Target Node Configuration ===== #
# Default node for dev VMs
dev_target_node: "walnut"

pve_clone_target_node: "{{ dev_target_node }}"

# ===== Notes ===== #
# To clone dev nodes, run:
# ansible-playbook playbooks/proxmox.yml --tags pve_clone_vm -e "pve_clone_targets={{ groups['dev'] }}" -i inventory/master_hosts.yml
#
# Or set pve_clone_targets in proxmox.yml:
# pve_clone_targets: "{{ groups['dev'] | default([]) }}"
#
# Dev VMs use linked clones to save space and faster deployment
# They won't auto-start on boot or after cloning