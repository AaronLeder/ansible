---
# ===== Connectivity ===== #
- name: Proxmox Host Connectivity
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    pve_api_host: "walnut"
    pve_api_port: 8006
    pve_api_user: "ansible@pve"
    pve_api_token_id: "ansible-maint001"
    pve_api_token_full_id: "{{ pve_api_user }}!{{ pve_api_token_id }}"
    pve_validate_certs: false

  vars_files:
    - ../vault/aaron-homelab.yml
  roles:
    - proxmox-host
  tags:
    - pve_connectivity

# ===== VM State ===== #
- name: Proxmox Change VM State
  hosts: proxmox
  connection: local
  gather_facts: false

  vars:
    pve_api_host: "walnut"
    pve_api_port: 8006
    pve_api_user: "ansible@pve"
    pve_api_token_id: "ansible-maint001"
    pve_api_token_full_id: "{{ pve_api_user }}!{{ pve_api_token_id }}"
    pve_validate_certs: false
    pve_timeout: 300

    # Define the state. Leave undefined or null to skip VM state tasks
    pve_vm_state: 

    # Map of VMIDs per Proxmox node (key must match inventory_hostname_short)
    pve_vm_map:
      walnut: [151, 152]
      rainbow: []
      cheddar: []
      squeak: []

  vars_files:
    - ../vault/aaron-homelab.yml
  roles:
    - proxmox-vm
  tags:
    - pve_state_vm

# ===== VM Create ===== #
- name: Create new Proxmox VMs from scratch
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    pve_api_host: "walnut"
    pve_api_port: 8006
    pve_api_user: "ansible@pve"
    pve_api_token_id: "ansible-maint001"
    pve_api_token_full_id: "{{ pve_api_user }}!{{ pve_api_token_id }}"
    pve_validate_certs: false

    # Enable create workflow
    pve_create_enabled: true

    # List the VMs to create (pulls config from inventory)
    pve_create_vm:
      - elastic001.aaron.lan
      #- elastic002.aaron.lan
      #- elastic003.aaron.lan

    # Hardware configuration
    pve_create_cores: 4
    pve_create_sockets: 1
    pve_create_memory: 8192
    pve_create_cpu: "host"

    # BIOS/Machine
    pve_create_bios: "seabios"
    pve_create_machine: "q35"
    pve_create_boot: "order=scsi0;ide2;net0"
    pve_create_ostype: "l26"

    # Storage - Use integer for size (in GB) without the 'G' suffix
    pve_create_storage: "mydata"
    pve_create_disk_size: 100
    pve_create_scsihw: "virtio-scsi-single"

    # Network - Using vmbr1 with VLAN 29
    pve_create_bridge: "vmbr1"
    pve_create_vlan: "29"
    
    # Network IP configuration
    pve_create_prefix: 24
    pve_create_gateway: 192.168.30.1

    # ISO - Use existing ISO from Proxmox storage. Leave empty if using cloud-init
    pve_create_iso: ""

    # Additional options
    pve_create_agent: "enabled=1"
    pve_create_onboot: false
    pve_create_protection: false
    pve_create_tags: "elasticsearch,production"
    pve_create_pool: ""

    # ===== Cloud-Init ===== #
    # Enable cloud-init
    pve_create_use_cloudinit: true

    pve_create_ciuser: "ansible"
    pve_create_cipassword: "{{ pve_new_vm_cipassword }}"
    
    # Add your SSH public key here
    pve_create_sshkeys: ""  # Add your SSH key: "ssh-rsa AAAAB3... user@host"

    # Auto-start after creation
    pve_create_autostart: true

    pve_create_timeout: 300

  vars_files:
    - ../vault/aaron-homelab.yml
  roles:
    - proxmox-vm
  tags:
    - pve_create_vm

# ===== VM Clone from Cloud-Init Template ===== #
- name: Clone Proxmox VMs from Cloud-Init Template
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    pve_api_host: "walnut"
    pve_api_port: 8006
    pve_api_user: "ansible@pve"
    pve_api_token_id: "ansible-maint001"
    pve_api_token_full_id: "{{ pve_api_user }}!{{ pve_api_token_id }}"
    pve_validate_certs: false

    # ===== ENABLE CLONE WORKFLOW ===== #
    pve_clone_enabled: true

    # ===== CLONE TARGET CONFIGURATION ===== #
    # Specify VMs to clone - these must exist in your inventory with:
    # - ansible_host (IP address)
    # - pve_vmid (unique VM ID)
    # 
    # Example inventory entry:
    # [pve_vm_to_clone]
    # elastic001.aaron.lan ansible_host=192.168.30.10 pve_vmid=201
    # elastic002.aaron.lan ansible_host=192.168.30.11 pve_vmid=202
    #
    # Or set via inventory group 'pve_vm_to_clone'

    # ===== TEMPLATE CONFIGURATION ===== #
    # Cloud-init template created with setup script
    pve_clone_template_id: 9000
    pve_clone_template_name: "elastic-ubuntu-cloudinit"
    
    # Clone settings
    pve_clone_storage: mydata
    pve_clone_format: qcow2
    pve_clone_pool: ""
    pve_clone_full: true  # true = full clone, false = linked clone
    pve_clone_timeout: 900

    # Target node (where clones will be created)
    pve_clone_target_node: "walnut"

    # ===== NETWORK CONFIGURATION ===== #
    # Network IP configuration (used by cloud-init)
    pve_create_prefix: 24
    pve_create_gateway: 192.168.30.1

    # ===== CLOUD-INIT CONFIGURATION ===== #
    pve_create_use_cloudinit: true
    pve_create_ciuser: "ansible"
    pve_create_cipassword: "{{ pve_new_vm_cipassword }}"
    
    # Add your SSH public key here (URL-encoded)
    # Generate with: python3 -c "import urllib.parse; print(urllib.parse.quote(open('~/.ssh/id_rsa.pub').read().strip(), safe=''))"
    pve_create_sshkeys: ""  # Example: "ssh-rsa%20AAAAB3NzaC1yc2EAAAADAQABAAAB..."
    
    # ===== ADDITIONAL OPTIONS ===== #
    # Tags for cloned VMs
    pve_create_tags: "elasticsearch,production"
    
    # Auto-start VMs after cloning
    pve_create_autostart: true

  vars_files:
    - ../vault/aaron-homelab.yml
  roles:
    - proxmox-vm
  tags:
    - pve_clone_vm